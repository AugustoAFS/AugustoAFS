name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AugustoAFS
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF416C&color_dots=#161b22,#4a1d2a,#7a2537,#b02e48,#ff416c
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#C81E4A&color_dots=#ebedf0,#ffd0d9,#ff9fb3,#ff6b8b,#c81e4a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
